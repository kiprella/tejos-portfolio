<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tejos — Hair</title>
    <meta
      name="description"
      content="Tejos — a black and white showcase of precision cuts and quiet colour."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&family=Italiana&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=66" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <header class="site-header">
      <a class="site-tagline" href="anywhere.html">anywhere anytime</a>
      <nav class="nav" aria-label="Primary">
        <a href="#showcase">Showcase</a>
        <a href="#booking">Book</a>
        <a
          href="https://www.instagram.com/t3jakirp3ja/"
          rel="noopener noreferrer"
          target="_blank"
          >Instagram</a
        >
      </nav>
    </header>

    <main id="top">
      <section class="panel panel--hero panel--clear" aria-label="Jausena po">
        <a class="panel-media" href="look.html?id=lived-in-wave">
          <img
            src="images/lived-in-wave.jpg"
            alt="Jausena po"
          />
        </a>
        <a class="panel-copy" href="look.html?id=lived-in-wave">
          <h1 class="panel-title brand">jausena po</h1>
        </a>
        <a class="scroll-cue" href="#showcase" aria-label="Scroll to showcase"
          >Scroll</a
        >
      </section>

      <section id="showcase" class="showcase" aria-label="Work showcase">
        <figure class="panel panel--clear shot">
          <a
            class="panel-media"
            href="look.html?id=haired"
            aria-label="Open Haired"
          >
            <img
              src="images/hero.jpg"
              alt="Haired"
              loading="lazy"
            />
          </a>
          <a class="panel-copy" href="look.html?id=haired">
            <figcaption class="panel-title">haired</figcaption>
          </a>
        </figure>

        <figure class="panel panel--full panel--clear shot">
          <a
            class="panel-media"
            href="look.html?id=hair-free-head-free"
            aria-label="Open Hair free head free"
          >
            <img
              src="images/textured-crop.gif"
              alt="Hair free head free"
              loading="lazy"
            />
          </a>
          <a class="panel-copy panel-copy--stack" href="look.html?id=hair-free-head-free">
            <figcaption class="panel-title panel-title--stack">
              hair free<br />head free
            </figcaption>
            <p class="panel-sub">DJ and cut</p>
          </a>
        </figure>

        <figure class="panel panel--full panel--clear shot">
          <a
            class="panel-media"
            href="look.html?id=saules-pabuciuoti"
            aria-label="Open Saulės pabučiuoti"
          >
            <video
              src="images/precision-fade.mp4?v=2"
              autoplay
              muted
              loop
              playsinline
              preload="auto"
              aria-label="Saulės pabučiuoti"
            ></video>
          </a>
          <a class="panel-copy" href="look.html?id=saules-pabuciuoti">
            <figcaption class="panel-title">Saulės pabučiuoti</figcaption>
          </a>
        </figure>

        <figure class="panel panel--clear shot">
          <a
            class="panel-media"
            href="look.html?id=long-layer"
            aria-label="Open Garbanos"
          >
            <img
              src="images/long-layer.jpg?v=2"
              alt="Garbanos"
              loading="lazy"
            />
          </a>
          <a class="panel-copy" href="look.html?id=long-layer">
            <figcaption class="panel-title">Garbanos</figcaption>
          </a>
        </figure>

        <figure class="panel panel--clear shot">
          <a
            class="panel-media"
            href="look.html?id=clean-line-upstyle"
            aria-label="Open Jūs"
          >
            <img
              src="images/jus-panel.jpg?v=3"
              alt="Jūs"
              loading="lazy"
            />
          </a>
          <a class="panel-copy" href="look.html?id=clean-line-upstyle">
            <figcaption class="panel-title">jūs</figcaption>
          </a>
        </figure>

        <figure class="panel panel--clear shot">
          <a
            class="panel-media"
            href="look.html?id=soft-fringe"
            aria-label="Open Soft fringe"
          >
            <img
              src="https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=1200&q=80"
              alt="Soft fringe framing the face"
              loading="lazy"
              width="1200"
              height="1500"
            />
          </a>
          <a class="panel-copy" href="look.html?id=soft-fringe">
            <figcaption class="panel-title">Soft fringe</figcaption>
          </a>
        </figure>

        <figure class="panel panel--clear shot">
          <a
            class="panel-media"
            href="look.html?id=gloss-finish"
            aria-label="Open Gloss finish"
          >
            <img
              src="https://images.unsplash.com/photo-1527799820374-dcf8d9d4a388?auto=format&fit=crop&w=1800&q=80"
              alt="High-gloss finish on dark hair"
              loading="lazy"
              width="1800"
              height="1200"
            />
          </a>
          <a class="panel-copy" href="look.html?id=gloss-finish">
            <figcaption class="panel-title">Gloss finish</figcaption>
          </a>
        </figure>

        <figure class="panel panel--clear shot">
          <a
            class="panel-media"
            href="look.html?id=sharp-silhouette"
            aria-label="Open Sharp silhouette"
          >
            <img
              src="https://images.unsplash.com/photo-1580618672591-eb180b1a973f?auto=format&fit=crop&w=1400&q=80"
              alt="Sharp silhouette haircut"
              loading="lazy"
              width="1400"
              height="1867"
            />
          </a>
          <a class="panel-copy" href="look.html?id=sharp-silhouette">
            <figcaption class="panel-title">Sharp silhouette</figcaption>
          </a>
        </figure>
      </section>

      <section id="booking" class="booking" aria-labelledby="booking-title">
        <h2 id="booking-title">Book</h2>
        <p>Appointments via Instagram DM.</p>
        <a
          class="booking-link"
          href="https://www.instagram.com/t3jakirp3ja/"
          rel="noopener noreferrer"
          target="_blank"
          >@t3jakirp3ja</a
        >
      </section>
    </main>

    <footer class="site-footer">
      <a class="logo" href="#top">Tejos</a>
      <div class="footer-links">
        <a href="mailto:hello@tejos.studio">hello@tejos.studio</a>
        <a
          href="https://www.instagram.com/t3jakirp3ja/"
          rel="noopener noreferrer"
          target="_blank"
          >Instagram</a
        >
      </div>
      <p class="copy">© <span data-year></span></p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
